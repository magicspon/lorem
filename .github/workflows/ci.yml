# Checks every pull request and every push to main. Vercel deploys on its own
# through its Git integration: a preview for every pull request, and
# production only when a release bumps the app's version
# (`apps/client/vercel.json`). This workflow is what decides a PR can merge.
#
# Each check is its own job so they run side by side: the run takes as long as
# the slowest check, not the sum of them all.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STORYBOOK_DISABLE_TELEMETRY: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # The quick checks share one job: each takes seconds, so a job apiece would
  # spend more time on setup than on checking.
  lint:
    name: Format, lint and spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Format and lint
        run: pnpm check

      - name: Spelling
        run: pnpm spell-check

      - name: Changesets name real packages
        run: pnpm changeset:check

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The stories run as tests in headless Chromium. Playwright comes in
      # through `@repo/config`, so its own copy installs the browser.
      - name: Install Chromium
        run: pnpm --filter @repo/config exec playwright install --with-deps chromium

      - run: pnpm test

  # Catches a build that breaks even when the tests pass.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build
