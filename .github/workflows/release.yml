# Turns pending changesets into versions. While changesets wait on main, this
# keeps a "Version packages" pull request open. Merging it bumps the versions,
# writes the changelogs, and tags each new version. Every package is private,
# so nothing is published to npm.
name: Release

on:
  push:
    branches: [main]

# Two releases at once would fight over the same pull request and tags.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The changelog links each entry to its commit and pull request.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
